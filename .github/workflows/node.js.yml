name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Authenticate to GitHub Packages
        run: |
          echo "@open-ccw:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run build
